<svg xmlns="http://www.w3.org/2000/svg" width="750" height="300" viewBox="0 0 750 300" fill="none">
  <rect width="750" height="300" fill="#f8faf8" rx="8" stroke="#c8e6c9"/>
  <text x="375" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle">Global Food Waste Key Statistics</text>
  
  <rect x="50" y="80" width="190" height="170" fill="#ffffff" rx="6" stroke="#a5d6a7"/>
  <text x="145" y="130" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1b5e20" text-anchor="middle">33%</text>
  <text x="145" y="165" font-family="sans-serif" font-size="13" fill="#444444" text-anchor="middle">Global Food Waste</text>

  <rect x="280" y="80" width="190" height="170" fill="#ffffff" rx="6" stroke="#a5d6a7"/>
  <text x="375" y="130" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1b5e20" text-anchor="middle">$1,500</text>
  <text x="375" y="165" font-family="sans-serif" font-size="13" fill="#444444" text-anchor="middle">Average Annual Loss / Family</text>

  <rect x="510" y="80" width="190" height="170" fill="#ffffff" rx="6" stroke="#a5d6a7"/>
  <text x="605" y="130" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1b5e20" text-anchor="middle">8%</text>
  <text x="605" y="165" font-family="sans-serif" font-size="13" fill="#444444" text-anchor="middle">Global Emissions Impact</text>
</svg>
